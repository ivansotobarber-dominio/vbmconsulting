<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="Terreno, prototipo local de preparación deportiva con datos ficticios.">
  <title>Terreno · Equipo demo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/lucide.min.js" defer></script>
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip" href="#main">Ir al contenido</a>
  <header class="app-header">
    <div class="brand"><span class="brand-symbol" aria-hidden="true">T.</span><span>terreno<span class="brand-sub">Preparación deportiva</span></span></div>
    <div class="team-identity"><strong>Equipo demo</strong><span>Fútbol 11 · Adultos ficticios</span></div>
    <div class="header-end"><span class="demo-badge">DEMO PÚBLICA</span><button class="icon-button" data-action="export" title="Exportar JSON" aria-label="Exportar JSON"><i data-lucide="download"></i></button><button class="icon-button" data-action="print" title="Imprimir resumen" aria-label="Imprimir resumen"><i data-lucide="printer"></i></button></div>
  </header>
  <div class="storage-warning" role="note">Demo pública. Solo datos ficticios. No introduzcas datos reales.</div>
  <div id="storage-warning" class="storage-warning" role="alert" hidden></div>
  <div class="workspace">
    <div class="nav-row"><nav class="tabs" role="tablist" aria-label="Vistas de preparación">
      <button id="tab-week" role="tab" aria-selected="true" aria-controls="view-panel" data-tab="week"><i data-lucide="calendar-days"></i><span>Semana</span></button>
      <button id="tab-board" role="tab" aria-selected="false" aria-controls="view-panel" tabindex="-1" data-tab="board"><i data-lucide="waypoints"></i><span>Pizarra</span></button>
      <button id="tab-analysis" role="tab" aria-selected="false" aria-controls="view-panel" tabindex="-1" data-tab="analysis"><i data-lucide="scan-eye"></i><span>Análisis</span></button>
      <button id="tab-match" role="tab" aria-selected="false" aria-controls="view-panel" tabindex="-1" data-tab="match"><i data-lucide="flag"></i><span>Partido</span></button>
      <button id="tab-summary" role="tab" aria-selected="false" aria-controls="view-panel" tabindex="-1" data-tab="summary"><i data-lucide="clipboard-list"></i><span>Resumen</span></button>
    </nav><span id="save-status" class="save-status" role="status">Datos de demo</span></div>
    <main id="main" tabindex="-1"><div id="view-panel" role="tabpanel" aria-labelledby="tab-week"></div></main>
    <footer class="app-footer"><span>Temporada de demo 2026/27 · Sin datos reales</span><button class="text-button" data-action="reset"><i data-lucide="rotate-ccw"></i>Restablecer demo</button></footer>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <dialog id="session-dialog" aria-labelledby="session-dialog-title">
    <form id="new-session-form"><div class="dialog-heading"><h2 id="session-dialog-title">Nueva sesión</h2><button type="button" class="icon-button" data-action="close-dialog" aria-label="Cerrar" title="Cerrar"><i data-lucide="x"></i></button></div>
      <p id="new-session-day" class="muted"></p><label for="new-title">Nombre de la sesión</label><input id="new-title" name="title" maxlength="80" required autocomplete="off" placeholder="Trabajo de transiciones">
      <label for="new-objective">Objetivo</label><textarea id="new-objective" name="objective" maxlength="500" rows="3" placeholder="Objetivo colectivo de la sesión"></textarea>
      <div class="dialog-actions"><button type="button" class="secondary" data-action="close-dialog">Cancelar</button><button type="submit" class="primary"><i data-lucide="plus"></i>Crear sesión</button></div>
    </form>
  </dialog>
  <dialog id="library-dialog" aria-labelledby="library-title"><div class="dialog-heading"><h2 id="library-title">Biblioteca de tareas</h2><button class="icon-button" data-action="close-dialog" aria-label="Cerrar biblioteca" title="Cerrar"><i data-lucide="x"></i></button></div><div id="library-items"></div></dialog>
  <noscript><p class="storage-warning">JavaScript está desactivado. El prototipo no puede guardar ni editar datos.</p></noscript>
</body>
</html>
